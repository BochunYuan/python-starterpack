[package]
name = "mm-python-native"
version = "0.1.0"
edition = "2021"

[lib]
# The name Python's ctypes.CDLL loads: libmm_python_native.{so,dylib}/mm_python_native.dll.
name = "mm_python_native"
crate-type = ["cdylib"]

[dependencies]
# A git dependency, pinned by the committed `Cargo.lock` beside this file (see dev/ffi.md,
# "Competitor setup and version management"). Not a path dependency: a standalone clone of
# python-starterpack has no engine checkout next to it, so a path would make the crate
# unbuildable for every competitor and for the API's compile sandbox alike. Bumping the
# engine is `cargo update -p mm-engine` here, and the same rev has to be set as the api
# flake's `engine` input -- `HANDSHAKE_FINGERPRINT` fails the match if the two disagree.
mm-engine = { git = "https://github.com/mechmania/engine.git", default-features = false, features = ["client", "ffi"] }
# `mm-ffi-codegen` reads the registries `mm-engine` submits into. Same major version as the
# one `mm-engine` resolves, or the two would collect into different registries and the
# generator would see an empty one.
inventory = "0.3"
